name: Publish

# Builds the testkeel package and publishes it with PyPI trusted publishing: no token is
# stored anywhere. A push of a testkeel-v<version> tag publishes to PyPI; a manual run
# publishes the same build to TestPyPI and never to PyPI. Plain v* tags belong to
# release.yml and do not match here. Why: docs/ci-decisions.md#package
on:
  push:
    tags: ["testkeel-v*"]
  workflow_dispatch:

# Never cancel a publish in progress: a cancelled upload can leave a partial release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the tagged commit can be checked against the default branch.
          fetch-depth: 0
          persist-credentials: false

      # A release is cut from the default branch only, never from an unreviewed commit.
      - name: The tagged commit is on the default branch
        if: github.event_name == 'push'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "$GITHUB_SHA is not on $DEFAULT_BRANCH: tag a commit from $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      # The version is written once, in src/testkeel/__init__.py; the tag must name it.
      - name: The tag names the package version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          text = Path("src/testkeel/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', text, re.MULTILINE)
          if not match:
              sys.exit("no __version__ literal in src/testkeel/__init__.py")
          tag, expected = os.environ["TAG"], f"testkeel-v{match.group(1)}"
          print(f"tag {tag}, package version {match.group(1)}")
          if tag != expected:
              sys.exit(f"tag {tag} does not name the package version: expected {expected}")
          PY

      - name: Build the wheel and sdist
        run: uv build --out-dir dist

      - name: Check the distribution metadata
        run: uvx twine==7.0.0 check --strict dist/*

      - name: The wheel contains only the package
        run: python3 -m tools.wheel_check dist

      # Installs the wheel alone, outside the source tree, so a missing data file or
      # dependency fails here and not on a user's machine.
      - name: Smoke-install the wheel
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/testkeel-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/testkeel" --version
          "$RUNNER_TEMP/smoke/bin/testkeel" list-types

      - name: Keep the distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/testkeel-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/testkeel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/testkeel/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

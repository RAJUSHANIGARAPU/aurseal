name: Secret scan

# Every push on every branch (bring-up and feature branches included) and every pull
# request. A root job with no condition and no dependency: nothing in any workflow can
# skip it, and gate.workflow_lint fails a change that adds either.
# Why: docs/ci-decisions.md#secret-scan
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secrets (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: every pushed commit is scanned, not just the tip.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks && sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secrets (git history)
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

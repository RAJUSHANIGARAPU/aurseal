version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      prefix-development: chore
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
        # A ruff minor release reformats files; it comes on its own with the reformat.
        # pytest-playwright is pre-1.0, so a minor can break the browser fixtures: its own PR too.
        exclude-patterns: [ruff, pytest-playwright]
    ignore:
      # The browser containers in tests.yml are pinned to this tag; workflow_lint fails a mismatch.
      - dependency-name: playwright
      # Mutation scores are only comparable within one mutmut version; bump it deliberately.
      - dependency-name: mutmut

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["reports", ".venv", "__pycache__", "ext-config", "evidence", "evidence-in"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------- the testkeel package
# Only src/testkeel is packaged; the framework modules at the repository root are not.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "testkeel"
version = "0.1.0"
description = "Scaffold, check and report on test automation projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2,<3",
    "copier>=9,<10",
    "typer>=0.12,<1",
]

[project.scripts]
testkeel = "testkeel.cli:app"

[project.entry-points."testkeel.importers"]
cypress = "testkeel.importers.cypress:CypressImporter"
junit = "testkeel.importers.junit:JUnitImporter"
newman = "testkeel.importers.newman:NewmanImporter"
playwright = "testkeel.importers.playwright:PlaywrightImporter"
testkeel = "testkeel.importers.upload:UploadImporter"

[project.entry-points.pytest11]
# Inert unless --testkeel-out is given.
testkeel = "testkeel.pytest_plugin"

[project.entry-points."testkeel.reporters"]
html = "testkeel.reporting.html:HtmlReporter"

[tool.hatch.build.targets.wheel]
packages = ["src/testkeel"]
# Template files are package data, dotfiles (.gitignore.jinja, .pymarkdown.json) included.
artifacts = [
    "src/testkeel/templates/**/*.jinja",
    "src/testkeel/templates/**/*.part",
    "src/testkeel/templates/**/.*",
    "src/testkeel/templates/**/copier.yml",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/testkeel", "LICENSE", "README.md", "pyproject.toml"]

[tool.mypy]
python_version = "3.11"
strict = true
# The repository root has an __init__.py; without these the package would be read as
# <root>.src.testkeel instead of testkeel.
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
# Assignment templates are Copier sources, not importable modules; generated projects
# run their own mypy.
exclude = ["^src/testkeel/templates/"]

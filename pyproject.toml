[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["reports", ".venv", "__pycache__", "ext-config", "evidence", "evidence-in"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------- the aurseal package
# Only src/aurseal is packaged; the framework modules at the repository root are not.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aurseal"
dynamic = ["version"]
description = "Scaffold, check and report on test automation projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2,<3",
    "copier>=9,<10",
    "typer>=0.12,<1",
]

[project.scripts]
aurseal = "aurseal.cli:app"

[project.entry-points."aurseal.importers"]
cypress = "aurseal.importers.cypress:CypressImporter"
junit = "aurseal.importers.junit:JUnitImporter"
k6 = "aurseal.importers.k6:K6Importer"
newman = "aurseal.importers.newman:NewmanImporter"
playwright = "aurseal.importers.playwright:PlaywrightImporter"
aurseal = "aurseal.importers.upload:UploadImporter"

[project.entry-points."aurseal.result_types"]
"perf.k6" = "aurseal.importers.k6:K6ResultType"

[project.entry-points.pytest11]
# Inert unless --aurseal-out is given.
aurseal = "aurseal.pytest_plugin"

[project.entry-points."aurseal.reporters"]
html = "aurseal.reporting.html:HtmlReporter"

[tool.hatch.version]
path = "src/aurseal/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aurseal"]
# Template files are package data, dotfiles (.gitignore.jinja, .pymarkdown.json) included.
artifacts = [
    "src/aurseal/templates/**/*.jinja",
    "src/aurseal/templates/**/*.part",
    "src/aurseal/templates/**/.*",
    "src/aurseal/templates/**/copier.yml",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/aurseal", "LICENSE", "README.md", "pyproject.toml"]

[tool.mypy]
python_version = "3.11"
strict = true
# The repository root has an __init__.py; without these the package would be read as
# <root>.src.aurseal instead of aurseal.
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
# Assignment templates are Copier sources, not importable modules; generated projects
# run their own mypy.
exclude = ["^src/aurseal/templates/"]

[pytest]
pythonpath = .
addopts = -v --alluredir=reports/allure-results
testpaths =
    ui/tests
    api/tests
    tests
markers =
    smoke
    regression
    e2e
    negative: negative test scenarios
    api: api test
    contract
    unit: framework self-tests; own lane, run first
    on_demand: harness/config validations, not product signal; opt in with INCLUDE_MANUAL_CHECKS
    slow: long-running checks; opt in with RUN_SLOW_TESTS
    stateful: mutates shared backend state; sequential
    seeded: needs data it acquired; counted by the run-trust fixture-provenance rule
    journey_group(group): skip peers after a deterministic shared-step failure in the group
    serial: not safe next to another process; runs in the serial lane of a sharded run
    demo_ui: browser example against the in-repo demo system; runs in the browser lane
    case_id(id): pin a test case's identity across renames
    owner(team): who owns the test case
    priority(level): test case priority, e.g. P1
    feature(name): the product feature a test case covers
    requirement(*ids): the product requirements this test covers (REQUIREMENTS_STRICT=true fails bad ids)
    service(*names): the services a test exercises; read by gate.service_selection (config/service_map.json)
    covers(*items): API operations ('GET /path/{id}') or spec scenarios ('spec:<file>#<scenario>') this test covers
    generated_batch(name): one batch written by /generate-from-swagger; select with -m "generated_batch(name='<feature>')"
    render_check: document rendering behind a bearer token; own opt-in job (gate.token_lane), never gates
    draft(generator, source, generated_at): generated test awaiting review; excluded from the gate and from evidence

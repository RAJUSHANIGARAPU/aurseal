{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Paste an API token. It is kept in a session cookie for this site only.</p>
{% if error %}<p class="bad" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/ui/login">
  <label for="token">API token</label><br>
  <input id="token" data-testid="login-token" name="token" type="password" autocomplete="off" size="60" required>
  <button type="submit" data-testid="login-submit">Sign in</button>
</form>
{% endblock %}

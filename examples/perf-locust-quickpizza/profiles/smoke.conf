# Smoke: 5 users for 30 s. Proves the target is up and answers inside the smoke budget.
# The only profile that may point at a host you do not own.
locustfile = locustfiles/api_user.py
headless = true
users = 5
spawn-rate = 5
run-time = 30s
only-summary = true
csv = reports/smoke
html = reports/smoke.html
# Locust would exit 1 on any failed request; the SLO check (slo.json) decides instead.
exit-code-on-error = 0

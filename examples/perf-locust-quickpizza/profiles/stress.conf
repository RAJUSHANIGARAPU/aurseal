# Stress: StepRamp adds users past the expected peak and stops once the error budget is
# spent; the user count it reached is the capacity limit. run-time is only a safety cap.
# Refused against a non-local target (make stress runs the guard first).
locustfile = locustfiles/stress.py
headless = true
run-time = 10m
only-summary = true
csv = reports/stress
html = reports/stress.html
exit-code-on-error = 0

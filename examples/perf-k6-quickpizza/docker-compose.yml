# Everything local: QuickPizza itself and k6, so load and stress never leave this machine.
#   docker compose up -d quickpizza                       # the target, on localhost:3333
#   docker compose run --rm k6 run k6/scenarios/load.js   # a profile, in a container
services:
  quickpizza:
    # Pinned: numbers are only comparable between runs of the same version.
    image: ghcr.io/grafana/quickpizza-local:0.15.31
    ports:
      - "3333:3333"

  k6:
    build: .
    depends_on:
      - quickpizza
    environment:
      # The Compose service name: a single-label host the target guard treats as local.
      TARGET_URL: ${APP_TARGET_URL:-http://quickpizza:3333}
      ALLOW_REMOTE_LOAD: ${ALLOW_REMOTE_LOAD:-}
    volumes:
      - ./reports:/app/reports

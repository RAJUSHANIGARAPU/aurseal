# Not the W3C demo. Its pages come under the W3C document licence (unmodified copies with
# a notice, no derivatives), which is not a clear enough grant to vendor them. This server
# answers the demo's four "after" paths with the example's own fixed fixture
# (tests/fixtures/static/after.html) and the "before" paths with its planted-violation
# fixture. A local run proves the scanner, the baseline and the reports work over HTTP;
# only the nightly live run judges the demo.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Keeps the browser on this origin: a local run cannot reach any other host.
    add_header Content-Security-Policy "default-src 'self' data: 'unsafe-inline'" always;

    location ~ ^/after/(home|news|tickets|survey)\.html$ {
        try_files /after.html =404;
    }
    location ~ ^/before/(home|news|tickets|survey)\.html$ {
        try_files /before.html =404;
    }
}

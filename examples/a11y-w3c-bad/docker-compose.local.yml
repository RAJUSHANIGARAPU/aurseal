# The local target of `make test-local`: nginx on localhost:8304 serving this example's own
# fixtures at the demo's page paths (local/nginx.conf says why it is not the demo itself).
services:
  pages:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    ports:
      - "127.0.0.1:8304:80"
    volumes:
      - ./tests/fixtures/static:/usr/share/nginx/html:ro
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro

server {
    listen 80;
    root /usr/share/nginx/html;

    # The app reports crashes to a third-party error tracker; this header keeps the browser
    # on this origin, so a local run cannot reach any other host from the page.
    add_header Content-Security-Policy "default-src 'self' data: blob: 'unsafe-inline'" always;

    # A single-page app: every route that is not a file is the app's index.html.
    location / {
        try_files $uri /index.html;
    }
}

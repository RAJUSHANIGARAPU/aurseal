# Release verdict policy (traceability/release.py). Strict by default: absence of
# evidence is not success. Change it in a reviewed pull request; the file's hash is
# recorded with every verdict.
version: 1
default_priority: must          # a requirement without a priority is treated as must-have
requirements:
  must:
    block: [FAILING, KNOWN_DEFECT]
    no_verdict: [UNCOVERED, NOT_RUN, UNVERIFIED, DRAFT_ONLY, PASSING, FLAKY, FIX_OBSERVED]
  should:
    block: [FAILING]
    no_verdict: [UNCOVERED, NOT_RUN, UNVERIFIED, DRAFT_ONLY]
  could:
    block: []
    no_verdict: []
detectors:
  block: [signature_mismatch, closed_regressed]
  no_verdict: [held_empty]
  attention: [cleared]
defects:
  blocking_severities: [critical, high]
  blocking_labels: [blocker]
  max_snapshot_age_hours: 168   # an older snapshot (or one with no date) is no verdict
# What ships (release decide --delta <promotion diff json>). No delta: "change scope
# unknown", which is no verdict, never a pass.
change_scope:
  regressing: block             # a commit the promotion would take back out
  claimed_fixed: block          # a shipped key whose detector still reproduces
  shipped_untested: block       # a shipped key no case link or test mentions
  open_defect_shipped: block    # a shipped key that is an open blocking defect
  unknown: no_verdict
coverage_gaps: block            # failed gap ratchet blocks; no gap report is no verdict
plan: optional                  # required: no --plan is no verdict
